<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Космические квесты{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/icon-space-station.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div id="quest-container">
        {% block content %}{% endblock %}
    </div>

    <a href="/glossary" class="glossary-float" title="Глоссарий — что значат термины">
        📖
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const glossary = {
                "peleng": "Пеленги — разумная раса, похожая на лягушек и ящериц. Имеют четыре руки, обожают спиртное и болота.",
                "duzallag": "Дзухаллаг — пеленгская диверсионно-разведывательная организация, промышляющая пиратством и шпионажем.",
                "poluos": "Полуось — индустриальная планета, покрытая сетью гостиниц, казино и ресторанов.",
                "betelgeuse": "Бетельгейзе — звездная система, в которой находится планета Полуось.",
                "malok": "Малоки — крупная, мускулистая раса, славящаяся своей силой и тяжелым вооружением.",
                "gaal": "Гаальцы — высокоразвитая раса, известная своими спецслужбами и технологиями.",
                "dominatory": "Доминаторы — враждебная раса, с которой идет война в Галактике.",
                "kacap": "Кацап — пеленг, пират, контрабандист и просто отпетый негодяй. Знает, где находится секретный космодром.",
                "fenya": "Фэяне — технически одаренная раса, часто работающая инженерами и учеными.",
                "raksh": "Рахиш — родная планета пеленгов, болотистая и опасная.",
                "rusman": "Русман — агент с планеты Окошки Виста, посредник и связной.",
                "cruiser": "Крейсер Дзухаллага — секретный военный корабль, совмещающий завод и боевую машину.",
                "ryaska": "Болотная ряска — традиционный пеленгский коктейль, любимый напиток Кацапа.",
                "vtekilla": "Втыкилла — крепкий напиток, популярный среди пиратов.",
                "guanava": "Гуанава — очень крепкая настойка для бывалых пиратов.",
                "dark_drink": "Махпельское тёмное — слабое пиво.",
                "nucker_malok": "Малокское ядерное — экстремально крепкий напиток, опасный для пеленгов."
            };

            const tip = document.createElement("div");
            tip.className = "glossary-tooltip-fixed";
            document.body.appendChild(tip);

            document.querySelectorAll(".glossary-term").forEach(function (term) {
                const key = term.getAttribute("data-term");
                if (!key || !glossary[key]) return;

                term.addEventListener("mouseenter", function () {
                    tip.textContent = glossary[key];
                    tip.classList.add("visible");

                    const rect = term.getBoundingClientRect();
                    const tipW = tip.offsetWidth;
                    const tipH = tip.offsetHeight;


                    let left = rect.left + rect.width / 2 - tipW / 2;
                    left = Math.max(10, Math.min(left, window.innerWidth - tipW - 10));


                    let top = rect.bottom + 6;

                    if (top + tipH > window.innerHeight - 10) {
                        top = rect.top - tipH - 6;
                    }

                    tip.style.left = left + "px";
                    tip.style.top = top + "px";
                });

                term.addEventListener("mouseleave", function () {
                    tip.classList.remove("visible");
                });
            });
        });
    </script>
</body>

</html>
