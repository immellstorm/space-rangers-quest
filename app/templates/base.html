<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Космические квесты{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/icon-space-station.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div id="quest-container">
        {% block content %}{% endblock %}
    </div>

    <a href="/glossary" class="glossary-float" title="Глоссарий — что значат термины">
        📖
    </a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const glossary = {
                "peleng": "Пеленги — разумная раса, похожая на лягушек и ящериц. Имеют четыре руки, обожают спиртное и болота.",
                "duzallag": "Дзухаллаг — пеленгская диверсионно-разведывательная организация, промышляющая пиратством и шпионажем.",
                "poluos": "Полуось — индустриальная планета, покрытая сетью гостиниц, казино и ресторанов.",
                "betelgeuse": "Бетельгейзе — звездная система, в которой находится планета Полуось.",
                "malok": "Малоки — крупная, мускулистая раса, славящаяся своей силой и тяжелым вооружением.",
                "gaal": "Гаальцы — высокоразвитая раса, известная своими спецслужбами и технологиями.",
                "dominatory": "Доминаторы — враждебная раса, с которой идет война в Галактике.",
                "kacap": "Кацап — пеленг, пират, контрабандист и просто отпетый негодяй. Знает, где находится секретный космодром.",
                "fenya": "Фэяне — технически одаренная раса, часто работающая инженерами и учеными.",
                "raksh": "Рахиш — родная планета пеленгов, болотистая и опасная."
            };

            document.querySelectorAll(".glossary-term").forEach(function (term) {
                const key = term.getAttribute("data-term");
                if (key && glossary[key]) {
                    term.setAttribute("data-tooltip", glossary[key]);
                    // при клике — переход на статью
                    term.style.cursor = "pointer";
                    term.addEventListener("click", () => {
                        window.location.href = `/glossary#${key}`;
                    });
                }
            });
        });
    </script>
</body>

</html>
