{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="layout intro-layout">
    <div class="main-col">
        <div class="block">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <h2 style="text-align:center;">Вход в игру</h2>

            {% if error %}
            <p style="color:#ff6b6b; text-align:center; margin-bottom:16px;">
                {{ error }}
            </p>
            {% endif %}

            <form method="post" action="/login" id="intro-form">
                <input type="text" name="username" required minlength="3" maxlength="32" placeholder="Твоё имя"
                    id="player-name-input" autocomplete="username">
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>
</div>
<audio loop preload="auto" src="/static/audio/background.mp3" id="menu-music"></audio>
<script>
    (function () {
        const a = document.getElementById('menu-music');
        if (!a) return;
        a.volume = 0.25;

        const play = () => a.play().catch(() => { });
        play();  // попытка автоплея
        document.addEventListener('click', play, { once: true });
        document.addEventListener('keydown', play, { once: true });
    })();
</script>
{% endblock %}
