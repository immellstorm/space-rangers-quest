{% extends "base.html" %}
{% block title %}Космические Рейнджеры 2{% endblock %}

{% block content %}
<div class="layout intro-layout">

    <div class="main-col">

        <div class="block auth-bar">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <p class="auth-line">
                Вы вошли как <strong>{{ username }}</strong>
            <form method="post" action="/logout" class="inline-form">
                <button type="submit" class="link-btn">сменить</button>
            </form>
            </p>
        </div>

        <div class="block">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <p id="intro-text">
                Привет, рейнджер.<br>
                Как назвать твоего героя?
            </p>
        </div>

        <div class="block">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <form id="intro-form" method="post" action="/start">
                <input type="text" name="player_name" required maxlength="20" value="{{ username }}"
                    placeholder="Имя героя" id="player-name-input">
                <button type="submit">Начать приключение</button>
            </form>
        </div>

    </div>
</div>

<audio loop preload="auto" src="/static/audio/background.mp3" id="menu-music"></audio>
<script src="/static/js/music.js" defer></script>
{% endblock %}
