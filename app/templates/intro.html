{% extends "base.html" %}
{% block title %}Космические Рейнджеры 2{% endblock %}

{% block content %}
<div class="layout intro-layout">

    <div class="main-col">
        <div class="block">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <p id="intro-text">Представься, рейнджер. Как к тебе обращаться?</p>
        </div>

        <div class="block">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <form id="intro-form" method="post" action="/start">
                <input type="text" name="player_name" required maxlength="20" placeholder="Имя" id="player-name-input">
                <button type="submit">Начать</button>
            </form>
        </div>
    </div>

    <aside class="side-col">
        <div class="block" id="scene-image">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <img src="/static/images/your_name.jpeg" alt="new">
        </div>
    </aside>

</div>
{% endblock %}
